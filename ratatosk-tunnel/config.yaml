name: Ratatosk Tunnel
description: Expose your Home Assistant instance to the internet via a Ratatosk tunnel
version: "0.2.0"
slug: ratatosk
url: https://github.com/ragnarok22/ratatosk
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
host_network: true
init: false
options:
  server: ""
  control_token: ""
  # Remote relay addresses always use TLS; this also forces TLS for loopback.
  control_tls: true
  control_ca_file: ""
  control_server_name: ""
  port: 8123
  basic_auth: ""
  streamer: false
schema:
  server: str
  control_token: password
  control_tls: bool
  control_ca_file: str?
  control_server_name: str?
  port: port
  basic_auth: str?
  streamer: bool
